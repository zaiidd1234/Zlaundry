services:
  app:
    build: .
    image: root/zlaundry:v1
    ports:
      - "3000:3000"
    env_file:
      - src/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=kdfaneeh_zlaundry
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=kdfaneeh_zlaundry
    ports:
      - "3307:3306"
    volumes:
      - zlaundry_db_data:/var/lib/mysql
      - ./kdfaneeh_zlaundry.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  zlaundry_db_data: